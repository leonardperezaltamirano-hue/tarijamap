<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Trabajo | Panel Principal</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --britanico-color: #003366;
            --andalucia-color: #1b5e20;
            --border-radius: 12px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 2.5rem 1rem;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
        }

        header h1 {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        header p {
            color: #666;
            font-size: 1rem;
        }

        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 2rem;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-top: 6px solid #ccc;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }

        .card.britanico {
            border-top-color: var(--britanico-color);
        }

        .card.andalucia {
            border-top-color: var(--andalucia-color);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .card p {
            font-size: 0.95rem;
            color: #666;
            line-height: 1.4;
        }

        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>Portal Docente y Técnico</h1>
        <p>Selecciona la institución a la que deseas acceder</p>
    </header>

    <main>
        <div class="cards-container">
            <!-- Acceso a BRITÁNICO -->
            <a href="./britanico/" class="card britanico">
                <div class="card-icon">🇬🇧</div>
                <h2>BRITÁNICO</h2>
                <p>Recursos, planificaciones y accesos rápidos para el Británico.</p>
            </a>

            <!-- Acceso a Andalucía -->
            <a href="./andalucia/" class="card andalucia">
                <div class="card-icon">🏫</div>
                <h2>Andalucía</h2>
                <p>Registros pedagógicos, rúbricas y proyectos del Colegio Andalucía.</p>
            </a>
        </div>
    </main>

    <footer>
        <p>Herramienta Personal &copy; 2026</p>
    </footer>

</body>
</html>
