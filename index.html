<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarija MapTour - GPS y Rutas</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* Ajustar el mapa al alto total disponible de la pantalla */
        .alto-pantalla { height: calc(100vh - 56px); }
        @media (min-width: 768px) { .alto-pantalla { height: calc(100vh - 64px); } }

        /* Animación de pulso azul estilo Google Maps para el GPS */
        .gps-pulso {
            width: 14px;
            height: 14px;
            background-color: #2563eb;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7);
            animation: pulso 1.8s infinite cubic-bezier(0.66, 0, 0, 1);
        }
        @keyframes pulso {
            to { box-shadow: 0 0 0 12px rgba(37, 99, 235, 0); }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans overflow-hidden">

    <nav class="bg-blue-700 text-white h-14 md:h-16 px-4 flex items-center justify-between shadow-md z-30 relative">
        <div class="flex items-center gap-3">
            <button onclick="toggleMenuLateral(true)" class="bg-blue-800 hover:bg-blue-900 text-white p-2 rounded-lg text-xl focus:outline-none transition active:scale-95 cursor-pointer" title="Abrir menú de rutas">
                ☰
            </button>
            <h1 class="text-base md:text-xl font-bold tracking-wide">
                🚌 Tarija MapTour
            </h1>
        </div>
        <span class="text-[11px] md:text-sm bg-blue-600 px-3 py-1 rounded-full font-medium shadow-inner">📱 Pasajero</span>
    </nav>

    <div class="relative flex alto-pantalla w-full overflow-hidden">
        
        <aside id="menu-lateral" class="absolute top-0 bottom-0 left-0 w-72 md:w-80 bg-white shadow-[5px_0_25px_rgba(0,0,0,0.15)] z-40 flex flex-col transition-transform duration-300 transform -translate-x-full">
            
            <div class="p-4 border-b border-gray-200 bg-gray-50 flex items-center justify-between">
                <div>
                    <h2 class="font-bold text-gray-800 text-base">Líneas de Micro</h2>
                    <p class="text-[11px] text-gray-500">Selecciona para ver la ruta</p>
                </div>
                <button onclick="toggleMenuLateral(false)" class="text-gray-400 hover:text-gray-600 text-xl p-1 rounded-lg focus:outline-none cursor-pointer" title="Cerrar menú">
                    ✕
                </button>
            </div>

            <div id="lista-rutas-usuario" class="p-4 flex-grow overflow-y-auto space-y-2.5 bg-white">
                </div>

            <div class="p-4 border-t border-gray-200 bg-gray-50">
                <label class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl text-xs transition flex items-center justify-center gap-2 cursor-pointer text-center shadow-md active:scale-98">
                    📥 Añadir Más Rutas (.json)
                    <input type="file" accept=".json" class="hidden" onchange="importarNuevasRutasJSON(event)">
                </label>
            </div>
        </aside>

        <div id="capa-oscura" onclick="toggleMenuLateral(false)" class="absolute inset-0 bg-black/40 z-30 hidden transition-opacity duration-300 opacity-0"></div>

        <div id="map" class="z-10 flex-grow w-full h-full relative">
            
            <button id="btn-gps" class="absolute bottom-6 right-4 z-20 bg-white hover:bg-gray-100 text-gray-700 p-3.5 rounded-full shadow-2xl border border-gray-200 focus:outline-none transition-transform active:scale-95 text-xl" onclick="alternarLocalizacionGPS()" title="Mostrar mi ubicación actual">
                🎯
            </button>
            
        </div>

    </div>

    <script>
        // 1. Inicializar el mapa centrado en Tarija
        const tarijaCoords = [-21.53549, -64.72856];
        const map = L.map('map', { zoomControl: false }).setView(tarijaCoords, 14);
        
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 2. Base de Datos incrustada (Tus datos JSON guardados de forma segura)
        let sistemaRutasGlobal = [
            {
                "id": "linea_1781183102503",
                "nombre": "Micro A",
                "color": "#3b82f6",
                "trazado": [
                    [-21.542174168753746, -64.70826294340675], [-21.531961893333236, -64.71873062022466],
                    [-21.52837146960623, -64.72207684478121], [-21.521669107848112, -64.72645267689362],
                    [-21.5194349185483, -64.72851189200533], [-21.537147904218617, -64.73571914489635],
                    [-21.539222256705607, -64.73254452159911], [-21.541775265228342, -64.72422186052258],
                    [-21.544328228845615, -64.71272457614882], [-21.54512602076617, -64.7091209497033],
                    [-21.542812412113957, -64.70843454466608]
                ],
                "paradas": [
                    [-21.535472444033594, -64.71469799063088], [-21.540977454888633, -64.72782548696809]
                ],
                "capaLinea": null, "grupoParadas": null
            },
            {
                "id": "linea_1781183179965",
                "nombre": "Micro B",
                "color": "#f73b3b",
                "trazado": [
                    [-21.546081181000005, -64.70002379848945], [-21.538023334100785, -64.69659177330324],
                    [-21.535869180443832, -64.70259781737909], [-21.536188316335807, -64.70474283312046],
                    [-21.534672414601367, -64.70568664004666], [-21.531401204303325, -64.70585824130599],
                    [-21.531161844558937, -64.7111778803446], [-21.527810766714705, -64.70989087089976],
                    [-21.526374566826902, -64.71057727593701], [-21.52972567780795, -64.71529631056804],
                    [-21.534034135451943, -64.7193289401618], [-21.537943551202012, -64.71821353197629],
                    [-21.542650667203876, -64.71838513323561], [-21.543847367272967, -64.71323709545631],
                    [-21.544645161837007, -64.70920446586253], [-21.546081181000005, -64.70173981108253],
                    [-21.546320516145627, -64.70053860226737]
                ],
                "paradas": [
                    [-21.540735926569635, -64.69779298211841], [-21.543687807833887, -64.71606851623493],
                    [-21.53092248442007, -64.71641171875355]
                ],
                "capaLinea": null, "grupoParadas": null
            }
        ];

        let idSeguimientoGPS = null;
        let marcadorGPSUsuario = null;
        let circuloPrecisionGPS = null;
        let esPrimerCentradoGPS = true;

        // Estilos para marcadores de Leaflet
        const crearIconoParada = (color) => L.divIcon({
            html: `<div class="w-6 h-6 rounded-full border-2 border-white flex items-center justify-center shadow-lg text-white text-[10px] font-bold" style="background-color: ${color}">🚏</div>`,
            className: '', iconSize: [24, 24], iconAnchor: [12, 12]
        });

        const iconoGPSAzul = L.divIcon({
            html: `<div class="gps-pulso"></div>`,
            className: '', iconSize: [14, 14], iconAnchor: [7, 7]
        });

        // 3. Mecánica para visualizar / ocultar el menú lateral
        function toggleMenuLateral(abrir) {
            const menu = document.getElementById('menu-lateral');
            const capa = document.getElementById('capa-oscura');

            if (abrir) {
                menu.classList.remove('-translate-x-full');
                capa.classList.remove('hidden');
                setTimeout(() => { capa.classList.add('opacity-100'); }, 10);
            } else {
                menu.classList.add('-translate-x-full');
                capa.classList.remove('opacity-100');
                setTimeout(() => { capa.classList.add('hidden'); }, 300);
            }
        }

        // 4. Renderizar las rutas dentro del menú lateral
        function actualizarListaRutas() {
            const contenedor = document.getElementById('lista-rutas-usuario');
            contenedor.innerHTML = '';

            sistemaRutasGlobal.forEach(ruta => {
                const itemHTML = `
                    <div class="p-3.5 bg-gray-50 rounded-xl border border-gray-200 active:bg-gray-100 flex items-center justify-between transition shadow-2xs">
                        <label class="flex items-center cursor-pointer flex-grow py-1 select-none">
                            <input type="checkbox" class="w-5 h-5 text-blue-600 rounded border-gray-300 focus:ring-0 cursor-pointer" onchange="toggleVisualizacionRuta('${ruta.id}', this.checked)">
                            <span class="w-4 h-4 rounded-full ml-3 mr-2.5 shrink-0" style="background-color: ${ruta.color}"></span>
                            <span class="font-bold text-gray-800 text-base">${ruta.nombre}</span>
                        </label>
                        <span class="text-xs bg-gray-200 text-gray-700 font-bold px-2.5 py-1 rounded-full shrink-0">
                            🚏 ${ruta.paradas.length}
                        </span>
                    </div>
                `;
                contenedor.insertAdjacentHTML('beforeend', itemHTML);
            });
        }

        // 5. Manejar el encendido / apagado de capas geométricas en el mapa
        function toggleVisualizacionRuta(idRuta, visible) {
            const ruta = sistemaRutasGlobal.find(r => r.id === idRuta);
            if (!ruta) return;

            if (visible) {
                if (!ruta.capaLinea) {
                    ruta.capaLinea = L.polyline(ruta.trazado, { color: ruta.color, weight: 6, opacity: 0.85 });
                    ruta.grupoParadas = L.layerGroup();
                    ruta.paradas.forEach((pos, i) => {
                        L.marker(pos, { icon: crearIconoParada(ruta.color) })
                         .bindPopup(`<b>${ruta.nombre}</b><br>Parada N° ${i + 1}`)
                         .addTo(ruta.grupoParadas);
                    });
                }
                ruta.capaLinea.addTo(map);
                ruta.grupoParadas.addTo(map);
                
                // Cierra la barra lateral automáticamente al tickear para ver la ruta limpia
                toggleMenuLateral(false);
                
                map.fitBounds(ruta.capaLinea.getBounds());
            } else {
                if (ruta.capaLinea) map.removeLayer(ruta.capaLinea);
                if (ruta.grupoParadas) map.removeLayer(ruta.grupoParadas);
            }
        }

        // 6. Importar nuevas rutas extras desde ficheros .json externos
        function importarNuevasRutasJSON(event) {
            const archivo = event.target.files[0];
            if (!archivo) return;

            const lector = new FileReader();
            lector.onload = function(e) {
                try {
                    const datos = JSON.parse(e.target.result);
                    const arreglo = Array.isArray(datos) ? datos : [datos];
                    let nuevosAgregados = 0;

                    arreglo.forEach(r => {
                        if (r.nombre && r.trazado) {
                            const existe = sistemaRutasGlobal.some(e => e.id === r.id);
                            sistemaRutasGlobal.push({
                                id: existe || !r.id ? 'linea_' + Date.now() + Math.random() : r.id,
                                nombre: r.nombre, color: r.color || '#10b981',
                                trazado: r.trazado, paradas: r.paradas || [],
                                capaLinea: null, grupoParadas: null
                            });
                            nuevosAgregados++;
                        }
                    });

                    if(nuevosAgregados > 0) {
                        actualizarListaRutas();
                        alert(`¡Éxito! Se añadieron ${nuevosAgregados} rutas.`);
                    }
                } catch (error) { alert("Archivo JSON no compatible."); }
            };
            lector.readAsText(archivo);
            event.target.value = '';
        }

        // 7. Rastreo GPS Satelital
        function alternarLocalizacionGPS() {
            const botonGps = document.getElementById('btn-gps');

            if (idSeguimientoGPS !== null) {
                navigator.geolocation.clearWatch(idSeguimientoGPS);
                idSeguimientoGPS = null;
                if (marcadorGPSUsuario) map.removeLayer(marcadorGPSUsuario);
                if (circuloPrecisionGPS) map.removeLayer(circuloPrecisionGPS);
                marcadorGPSUsuario = null; circuloPrecisionGPS = null;
                botonGps.classList.remove('bg-blue-100', 'text-blue-600', 'border-blue-400');
                return;
            }

            if (!navigator.geolocation) {
                alert("GPS no soportado.");
                return;
            }

            botonGps.classList.add('bg-blue-100', 'text-blue-600', 'border-blue-400');
            esPrimerCentradoGPS = true;

            idSeguimientoGPS = navigator.geolocation.watchPosition(
                function(pos) {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    const precision = pos.coords.accuracy;

                    if (!marcadorGPSUsuario) {
                        marcadorGPSUsuario = L.marker([lat, lng], { icon: iconoGPSAzul }).addTo(map);
                        circuloPrecisionGPS = L.circle([lat, lng], { radius: precision, color: '#2563eb', weight: 1, fillColor: '#2563eb', fillOpacity: 0.15 }).addTo(map);
                    } else {
                        marcadorGPSUsuario.setLatLng([lat, lng]);
                        circuloPrecisionGPS.setLatLng([lat, lng]);
                        circuloPrecisionGPS.setRadius(precision);
                    }

                    if (esPrimerCentradoGPS) {
                        map.setView([lat, lng], 16);
                        esPrimerCentradoGPS = false;
                    }
                },
                function() {
                    alert("Aviso GPS: Para que el GPS rastree tu ubicación en la calle, el archivo debe subirse a internet usando un servidor seguro con HTTPS (como GitHub Pages).");
                    botonGps.classList.remove('bg-blue-100', 'text-blue-600', 'border-blue-400');
                    idSeguimientoGPS = null;
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 }
            );
        }

        // Carga Inicial automática
        actualizarListaRutas();
    </script>
</body>
</html>
