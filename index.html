<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarija MapTour Pro - GPS Activo</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        .alto-pantalla { height: calc(100vh - 64px); }
        
        /* Animación de pulso GPS */
        .gps-pulso {
            width: 16px;
            height: 16px;
            background-color: #059669;
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(5, 150, 105, 0.7);
            animation: pulso 1.6s infinite cubic-bezier(0.66, 0, 0, 1);
        }
        @keyframes pulso {
            to { box-shadow: 0 0 0 16px rgba(5, 150, 105, 0); }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans overflow-hidden">

    <nav class="bg-gray-800 h-16 px-4 flex items-center justify-between shadow-lg z-30 relative border-b border-gray-700">
        <div class="flex items-center gap-3">
            <button onclick="toggleMenuLateral(true)" class="bg-gray-700 hover:bg-gray-600 text-white p-2 rounded-xl text-xl transition active:scale-95 cursor-pointer">
                ☰
            </button>
            <h1 class="text-base md:text-lg font-bold tracking-wider text-emerald-400">
                📍 TARIJA MAPTOUR <span class="text-xs text-gray-400 font-normal hidden sm:inline">| GPS Inteligente</span>
            </h1>
        </div>
        <div id="estado-gps-barra" class="text-xs bg-gray-900 px-3 py-1.5 rounded-lg border border-gray-700 text-gray-400">
            📡 GPS: <span class="text-red-400 font-bold">Inactivo</span>
        </div>
    </nav>

    <div class="relative flex alto-pantalla w-full overflow-hidden">
        
        <aside id="menu-lateral" class="absolute top-0 bottom-0 left-0 w-72 md:w-80 bg-gray-800 shadow-2xl z-40 flex flex-col transition-transform duration-300 transform -translate-x-full border-r border-gray-700">
            <div class="p-4 border-b border-gray-700 bg-gray-850 flex items-center justify-between">
                <div>
                    <h2 class="font-bold text-white text-base">Líneas de Transporte</h2>
                    <p class="text-[11px] text-emerald-400 font-medium">Filtro de recorridos activos</p>
                </div>
                <button onclick="toggleMenuLateral(false)" class="text-gray-400 hover:text-white text-xl p-1 rounded-lg cursor-pointer">✕</button>
            </div>

            <div id="lista-rutas-usuario" class="p-4 flex-grow overflow-y-auto space-y-3 bg-gray-800">
                </div>

            <div class="p-4 bg-gray-900 border-t border-gray-700 space-y-2">
                <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest block">Asistente de Cercanía</span>
                <div id="telemetria-distancia" class="text-xs text-gray-300 bg-gray-800 p-2.5 rounded-lg border border-gray-700 italic">
                    Selecciona una ruta y enciende tu GPS para calcular la parada más cercana.
                </div>
            </div>

            <div class="p-4 bg-gray-850 border-t border-gray-700">
                <label class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl text-xs transition flex items-center justify-center gap-2 cursor-pointer text-center shadow-lg active:scale-98">
                    📥 Cargar Variante (.json)
                    <input type="file" accept=".json" class="hidden" onchange="importarNuevasRutasJSON(event)">
                </label>
            </div>
        </aside>

        <div id="capa-oscura" onclick="toggleMenuLateral(false)" class="absolute inset-0 bg-black/60 z-30 hidden transition-opacity duration-300 opacity-0"></div>

        <div id="map" class="z-10 flex-grow w-full h-full relative bg-gray-200">
            
            <div class="absolute top-4 left-4 z-30 bg-gray-800 p-1 rounded-xl border border-gray-700 shadow-2xl flex gap-1">
                <button id="btn-mapa-urbano" onclick="cambiarEstiloMapa('urbano')" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-gray-700 text-emerald-400 transition cursor-pointer">
                    🏙️ Urbano
                </button>
                <button id="btn-mapa-nocturno" onclick="cambiarEstiloMapa('nocturno')" class="text-xs font-bold px-3 py-1.5 rounded-lg text-gray-400 hover:text-white transition cursor-pointer">
                    🌙 Nocturno
                </button>
            </div>

            <button id="btn-gps" class="absolute top-28 right-3 z-30 bg-gray-800 hover:bg-gray-700 text-white w-12 h-12 rounded-xl shadow-2xl border border-gray-700 focus:outline-none transition-all active:scale-95 text-xl flex items-center justify-center cursor-pointer" onclick="alternarLocalizacionGPS()" title="Rastreo en tiempo real">
                🎯
            </button>
            
        </div>

    </div>

    <script>
        // Coordenadas céntricas de Tarija
        const tarijaCoords = [-21.53549, -64.72856];
        const map = L.map('map', { zoomControl: false }).setView(tarijaCoords, 14);
        
        // Colocar botones de zoom de Leaflet arriba a la derecha
        L.control.zoom({ position: 'topright' }).addTo(map);

        // Capas de mapas base
        const capaUrbana = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        });

        const capaNocturna = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap & CartoDB'
        });

        // OBLIGATORIO: Iniciar con el mapa claro/urbano para evitar pantallas negras en PC
        capaUrbana.addTo(map);
        let estiloMapaActual = 'urbano';

        // Cambiar el diseño visual del mapa sin colgar el renderizado
        function cambiarEstiloMapa(estilo) {
            const btnUrbano = document.getElementById('btn-mapa-urbano');
            const btnNocturno = document.getElementById('btn-mapa-nocturno');

            if (estilo === 'urbano' && estiloMapaActual !== 'urbano') {
                map.removeLayer(capaNocturna);
                capaUrbana.addTo(map);
                estiloMapaActual = 'urbano';
                
                btnUrbano.className = "text-xs font-bold px-3 py-1.5 rounded-lg bg-gray-700 text-emerald-400 transition cursor-pointer";
                btnNocturno.className = "text-xs font-bold px-3 py-1.5 rounded-lg text-gray-400 hover:text-white transition cursor-pointer";
            } else if (estilo === 'nocturno' && estiloMapaActual !== 'nocturno') {
                map.removeLayer(capaUrbana);
                capaNocturna.addTo(map);
                estiloMapaActual = 'nocturno';

                btnNocturno.className = "text-xs font-bold px-3 py-1.5 rounded-lg bg-gray-700 text-emerald-400 transition cursor-pointer";
                btnUrbano.className = "text-xs font-bold px-3 py-1.5 rounded-lg text-gray-400 hover:text-white transition cursor-pointer";
            }
        }

        // Base de Datos nativa interna
        let sistemaRutasGlobal = [
            {
                "id": "linea_A",
                "nombre": "Micro Línea A",
                "color": "#3b82f6",
                "trazado": [
                    [-21.542174168753746, -64.70826294340675], [-21.531961893333236, -64.71873062022466],
                    [-21.52837146960623, -64.72207684478121], [-21.521669107848112, -64.72645267689362],
                    [-21.5194349185483, -64.72851189200533], [-21.537147904218617, -64.73571914489635],
                    [-21.539222256705607, -64.73254452159911], [-21.541775265228342, -64.72422186052258],
                    [-21.544328228845615, -64.71272457614882], [-21.54512602076617, -64.7091209497033],
                    [-21.542812412113957, -64.70843454466608]
                ],
                "paradas": [
                    [-21.535472444033594, -64.71469799063088], [-21.540977454888633, -64.72782548696809]
                ],
                "capaLinea": null, "grupoParadas": null
            },
            {
                "id": "linea_B",
                "nombre": "Micro Línea B",
                "color": "#ef4444",
                "trazado": [
                    [-21.546081181000005, -64.70002379848945], [-21.538023334100785, -64.69659177330324],
                    [-21.535869180443832, -64.70259781737909], [-21.536188316335807, -64.70474283312046],
                    [-21.534672414601367, -64.70568664004666], [-21.531401204303325, -64.70585824130599],
                    [-21.531161844558937, -64.7111778803446], [-21.527810766714705, -64.70989087089976],
                    [-21.526374566826902, -64.71057727593701], [-21.52972567780795, -64.71529631056804],
                    [-21.534034135451943, -64.7193289401618], [-21.537943551202012, -64.71821353197629],
                    [-21.542650667203876, -64.71838513323561], [-21.543847367272967, -64.71323709545631],
                    [-21.544645161837007, -64.70920446586253], [-21.546081181000005, -64.70173981108253],
                    [-21.546320516145627, -64.70053860226737]
                ],
                "paradas": [
                    [-21.540735926569635, -64.69779298211841], [-21.543687807833887, -64.71606851623493],
                    [-21.53092248442007, -64.71641171875355]
                ],
                "capaLinea": null, "grupoParadas": null
            }
        ];

        let idSeguimientoGPS = null;
        let marcadorGPSUsuario = null;
        let circuloPrecisionGPS = null;
        let lineaHistorialCaminata = null; 
        let puntosCaminados = [];
        let esPrimerCentradoGPS = true;
        let rutaSeleccionadaId = null;

        const crearIconoParada = (color) => L.divIcon({
            html: `<div class="w-6 h-6 rounded-full border-2 border-white flex items-center justify-center shadow-2xl text-white text-[10px] font-black" style="background-color: ${color}">🚏</div>`,
            className: '', iconSize: [24, 24], iconAnchor: [12, 12]
        });

        const iconoGPSEmeralda = L.divIcon({
            html: `<div class="gps-pulso"></div>`,
            className: '', iconSize: [16, 16], iconAnchor: [8, 8]
        });

        function toggleMenuLateral(abrir) {
            const menu = document.getElementById('menu-lateral');
            const capa = document.getElementById('capa-oscura');
            if (abrir) {
                menu.classList.remove('-translate-x-full');
                capa.classList.remove('hidden');
                setTimeout(() => { capa.classList.add('opacity-100'); }, 10);
            } else {
                menu.classList.add('-translate-x-full');
                capa.classList.remove('opacity-100');
                setTimeout(() => { capa.classList.add('hidden'); }, 300);
            }
        }

        function actualizarListaRutas() {
            const contenedor = document.getElementById('lista-rutas-usuario');
            contenedor.innerHTML = '';
            sistemaRutasGlobal.forEach(ruta => {
                const itemHTML = `
                    <div class="p-3.5 bg-gray-700/50 rounded-xl border border-gray-700 flex items-center justify-between shadow-md">
                        <label class="flex items-center cursor-pointer flex-grow py-1 select-none text-gray-200">
                            <input type="radio" name="ruta-unica" class="w-5 h-5 text-emerald-500 bg-gray-800 border-gray-600 focus:ring-0 cursor-pointer" onchange="seleccionarRutaExclusiva('${ruta.id}')">
                            <span class="w-3.5 h-3.5 rounded-full ml-3 mr-2.5 shrink-0" style="background-color: ${ruta.color}"></span>
                            <span class="font-bold text-sm text-gray-200">${ruta.nombre}</span>
                        </label>
                        <span class="text-[10px] bg-gray-900 text-emerald-400 font-mono px-2 py-0.5 rounded border border-gray-700">
                            🚏 ${ruta.paradas.length} P.
                        </span>
                    </div>
                `;
                contenedor.insertAdjacentHTML('beforeend', itemHTML);
            });
        }

        function seleccionarRutaExclusiva(idRuta) {
            rutaSeleccionadaId = idRuta;
            
            sistemaRutasGlobal.forEach(ruta => {
                if (ruta.capaLinea) map.removeLayer(ruta.capaLinea);
                if (ruta.grupoParadas) map.removeLayer(ruta.grupoParadas);
            });

            const rutaActiva = sistemaRutasGlobal.find(r => r.id === idRuta);
            if (rutaActiva) {
                rutaActiva.capaLinea = L.polyline(rutaActiva.trazado, { color: rutaActiva.color, weight: 6, opacity: 0.9 });
                rutaActiva.grupoParadas = L.layerGroup();
                
                rutaActiva.paradas.forEach((pos, i) => {
                    L.marker(pos, { icon: crearIconoParada(rutaActiva.color) })
                     .bindPopup(`<b class="text-gray-900">${rutaActiva.nombre}</b><br><span class="text-gray-600 text-xs">Parada N° ${i + 1}</span>`)
                     .addTo(rutaActiva.grupoParadas);
                });

                rutaActiva.capaLinea.addTo(map);
                rutaActiva.grupoParadas.addTo(map);
                map.fitBounds(rutaActiva.capaLinea.getBounds(), { padding: [40, 40] });
            }
            toggleMenuLateral(false);
            
            if (marcadorGPSUsuario) {
                calcularMetricasDeCercania(marcadorGPSUsuario.getLatLng().lat, marcadorGPSUsuario.getLatLng().lng);
            }
        }

        function calcularDistanciaMetros(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const phi1 = lat1 * Math.PI / 180;
            const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                      Math.cos(phi1) * Math.cos(phi2) *
                      Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function calcularMetricasDeCercania(userLat, userLng) {
            const panelTxt = document.getElementById('telemetria-distancia');
            if (!rutaSeleccionadaId) {
                panelTxt.innerHTML = "⚠️ GPS encendido. Selecciona una línea de micro para medir las paradas.";
                return;
            }

            const rutaActiva = sistemaRutasGlobal.find(r => r.id === rutaSeleccionadaId);
            if (!rutaActiva || rutaActiva.paradas.length === 0) return;

            let distanciaMinima = Infinity;
            let indiceParadaCercana = 0;

            rutaActiva.paradas.forEach((parada, index) => {
                const d = calcularDistanciaMetros(userLat, userLng, parada[0], parada[1]);
                if (d < distanciaMinima) {
                    distanciaMinima = d;
                    indiceParadaCercana = index;
                }
            });

            const distFijada = Math.round(distanciaMinima);

            if (distFijada <= 50) {
                panelTxt.innerHTML = `<div class="bg-emerald-950 text-emerald-400 p-2 rounded border border-emerald-500 font-bold animate-pulse text-center">🎉 ¡Estás en la parada N° ${indiceParadaCercana + 1}!</div>`;
            } else {
                panelTxt.innerHTML = `🏁 Siguiendo: <b>${rutaActiva.nombre}</b>.<br>🚏 La parada más cercana (N° ${indiceParadaCercana + 1}) está a <span class="text-emerald-400 font-bold text-sm">${distFijada} metros</span>.`;
            }
        }

        // Sistema de Localización Satelital GPS
        function alternarLocalizacionGPS() {
            const botonGps = document.getElementById('btn-gps');
            const indicadorBarra = document.getElementById('estado-gps-barra');

            if (idSeguimientoGPS !== null) {
                navigator.geolocation.clearWatch(idSeguimientoGPS);
                idSeguimientoGPS = null;
                
                if (marcadorGPSUsuario) map.removeLayer(marcadorGPSUsuario);
                if (circuloPrecisionGPS) map.removeLayer(circuloPrecisionGPS);
                if (lineaHistorialCaminata) map.removeLayer(lineaHistorialCaminata);
                
                marcadorGPSUsuario = null; circuloPrecisionGPS = null; lineaHistorialCaminata = null;
                puntosCaminados = [];
                
                botonGps.classList.remove('bg-emerald-600', 'border-emerald-400');
                indicadorBarra.innerHTML = `📡 GPS: <span class="text-red-400 font-bold">Inactivo</span>`;
                return;
            }

            if (!navigator.geolocation) {
                alert("Este equipo no cuenta con soporte de hardware para GPS.");
                return;
            }

            botonGps.classList.add('bg-emerald-600', 'border-emerald-400');
            indicadorBarra.innerHTML = `📡 GPS: <span class="text-yellow-400 font-bold">Buscando...</span>`;
            esPrimerCentradoGPS = true;

            idSeguimientoGPS = navigator.geolocation.watchPosition(
                function(pos) {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    const precision = pos.coords.accuracy;

                    indicadorBarra.innerHTML = `📡 GPS: <span class="text-emerald-400 font-bold">En Vivo (±${Math.round(precision)}m)</span>`;
                    puntosCaminados.push([lat, lng]);

                    if (!marcadorGPSUsuario) {
                        marcadorGPSUsuario = L.marker([lat, lng], { icon: iconoGPSEmeralda }).addTo(map);
                        circuloPrecisionGPS = L.circle([lat, lng], { radius: precision, color: '#10b981', weight: 1, fillColor: '#10b981', fillOpacity: 0.1 }).addTo(map);
                        lineaHistorialCaminata = L.polyline(puntosCaminados, { color: '#3b82f6', weight: 3, dashArray: '6, 8', opacity: 0.7 }).addTo(map);
                    } else {
                        marcadorGPSUsuario.setLatLng([lat, lng]);
                        circuloPrecisionGPS.setLatLng([lat, lng]);
                        circuloPrecisionGPS.setRadius(precision);
                        lineaHistorialCaminata.setLatLngs(puntosCaminados);
                    }

                    calcularMetricasDeCercania(lat, lng);

                    if (esPrimerCentradoGPS) {
                        map.setView([lat, lng], 16);
                        esPrimerCentradoGPS = false;
                    }
                },
                function() {
                    alert("Aviso: No se pudo obtener la señal. Activa la 'Ubicación' en tu teléfono y otorga el permiso de GPS.");
                    botonGps.classList.remove('bg-emerald-600', 'border-emerald-400');
                    indicadorBarra.innerHTML = `📡 GPS: <span class="text-red-400 font-bold">Desconectado</span>`;
                    idSeguimientoGPS = null;
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
            );
        }

        function importarNuevasRutasJSON(event) {
            const archivo = event.target.files[0];
            if (!archivo) return;
            const lector = new FileReader();
            lector.onload = function(e) {
                try {
                    const datos = JSON.parse(e.target.result);
                    const arreglo = Array.isArray(datos) ? datos : [datos];
                    arreglo.forEach(r => {
                        if (r.nombre && r.trazado) {
                            sistemaRutasGlobal.push({
                                id: 'linea_' + Date.now() + Math.random(),
                                nombre: r.nombre, color: r.color || '#34d399',
                                trazado: r.trazado, paradas: r.paradas || [],
                                capaLinea: null, groupParadas: null
                            });
                        }
                    });
                    actualizarListaRutas();
                    alert("Rutas adicionales importadas.");
                } catch (er) { alert("JSON inválido."); }
            };
            lector.readAsText(archivo);
            event.target.value = '';
        }

        actualizarListaRutas();
    </script>
</body>
</html>
